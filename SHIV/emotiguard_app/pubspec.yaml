name: emotiguard_app
description: "EmotiGuard - IoT-based Emotional Distress Detection & Support System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Bluetooth Low Energy for ESP32
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Local Persistence & Encryption
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Network & Real-Time Sync
  http: ^1.2.1
  web_socket_channel: ^3.0.0

  # Escalation & Deep Linking
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # UI Enhancement
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
