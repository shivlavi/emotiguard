version: '3.8'

services:
  emotiguard-server:
    build: .
    container_name: emotiguard_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - emotiguard_data:/app/backend/data
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  emotiguard_data:
